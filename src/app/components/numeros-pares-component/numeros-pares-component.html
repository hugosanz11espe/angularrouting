<h1>Numeros pares</h1>
<div class="mb-3">
<form form="ngForm">
    Inicio: 
    <input type="number" name="cajainicio" #cajainicio class= form-control/>
    Fin: 
    <input type="number" name="cajafin" #cajafin class=form-control/>
    <button (click)="mostrarPares()" class="btn btn-success">
        Ver pares
    </button>
</form>
</div>
<ul class="list-group">
    @for (num of arrayNumeros; track num){
        <li class="list-group-item">{{num}}</li>
    }
</ul>
