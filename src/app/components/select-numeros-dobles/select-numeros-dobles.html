<h1>Select numeros</h1>
<form #form="ngForm">
    <button (click)="generarNumero()">
        Generar número
    </button>
    Seleccione un numero:
    <select name="selectnumero" #selectnumero>
        @for (num of arrayNumeros; track num){
            <option>{{num}}</option>
        }

     </select>
     <button (click)="mostrarDoble()">Ver doble</button>
</form>
@if (doble != 0) {
    <h1 style="color: rgb(0, 0, 0);">
    El doble es: {{doble}}
    </h1>
}
